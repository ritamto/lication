<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Editor</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: #121212; color: #eee;
    font-family: ui-monospace, Consolas, monospace;
    display: flex; flex-direction: column; height: 100vh; gap: 10px;
  }
  .bar { display: flex; align-items: center; gap: 12px; }
  h1 { font-size: 16px; margin: 0; flex: 1; font-weight: 600; }
  button {
    background: #2ea043; color: #fff; border: 0; padding: 8px 18px;
    border-radius: 6px; font: inherit; cursor: pointer;
  }
  button:disabled { background: #444; cursor: wait; }
  #clear { background: #333; }
  textarea, pre {
    width: 100%; margin: 0; padding: 12px; background: #1b1b1b; color: #eee;
    border: 1px solid #333; border-radius: 6px; font: 14px/1.5 ui-monospace, Consolas, monospace;
  }
  textarea { flex: 1; resize: none; tab-size: 4; outline: none; }
  textarea:focus { border-color: #2ea043; }
  pre { flex: 1; overflow: auto; white-space: pre-wrap; }
  .err { color: #ff6b6b; }
  .hint { color: #888; font-size: 12px; }
</style>
</head>
<body>
  <div class="bar">
    <h1>🐍 Python Editor <span class="hint">(Ctrl+Enter to run)</span></h1>
    <button id="clear">Clear output</button>
    <button id="run" disabled>Loading Python…</button>
  </div>

  <textarea id="code" spellcheck="false">print("Hello, World!")</textarea>
  <pre id="out">Output will appear here.</pre>

<script>
  const runBtn = document.getElementById("run");
  const codeEl = document.getElementById("code");
  const outEl  = document.getElementById("out");
  let pyodide;

  function write(text, isErr = false) {
    const span = document.createElement("span");
    if (isErr) span.className = "err";
    span.textContent = text + "\n";
    outEl.appendChild(span);
    outEl.scrollTop = outEl.scrollHeight;
  }

  async function init() {
    pyodide = await loadPyodide({
      stdout: (s) => write(s),
      stderr: (s) => write(s, true),
    });
    // Support input() via a browser prompt
    pyodide.setStdin({ stdin: () => prompt("Python input():") });
    runBtn.disabled = false;
    runBtn.textContent = "▶ Run";
  }

  async function run() {
    if (!pyodide) return;
    runBtn.disabled = true;
    outEl.textContent = "";
    try {
      await pyodide.loadPackagesFromImports(codeEl.value); // auto-loads numpy, etc.
      await pyodide.runPythonAsync(codeEl.value);
    } catch (e) {
      write(e.message, true);
    }
    runBtn.disabled = false;
  }

  runBtn.addEventListener("click", run);
  document.getElementById("clear").addEventListener("click", () => (outEl.textContent = ""));

  codeEl.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); }
    if (e.key === "Tab") {           // insert 4 spaces instead of leaving the box
      e.preventDefault();
      const s = codeEl.selectionStart;
      codeEl.value = codeEl.value.slice(0, s) + "    " + codeEl.value.slice(codeEl.selectionEnd);
      codeEl.selectionStart = codeEl.selectionEnd = s + 4;
    }
  });

  init();
</script>
</body>
</html>
